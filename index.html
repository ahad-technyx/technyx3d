<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Technyx Systems — AI-native technical partner. Senior-led engineering, delivered faster and at lower cost than a traditional IT company."
    />
    <title>Technyx Systems — AI-Native Engineering, Senior-Level Outcomes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      html, body { margin: 0; padding: 0; background: #050508; }
      body.is-loading { overflow: hidden; }
    </style>
  </head>
  <body class="is-loading">
    <!-- Splash loader: shown until Three.js scene is ready -->
    <div id="page-loader" class="page-loader" aria-hidden="true">
      <div class="page-loader__inner">
        <div class="page-loader__logo">
          <svg
            data-loader-svg
            class="page-loader__svg"
            viewBox="0 0 72 72"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <line x1="16" y1="20" x2="56" y2="20" />
            <line x1="36" y1="20" x2="36" y2="56" />
            <path d="M36 56 L36 56" />
          </svg>
          <span class="page-loader__ring"></span>
        </div>
        <div class="page-loader__label">
          <span class="page-loader__text">Loading</span>
          <span class="page-loader__pct" id="loader-pct">0%</span>
        </div>
        <div class="page-loader__bar">
          <div class="page-loader__fill" id="loader-fill"></div>
        </div>
      </div>
    </div>

    <div id="app"></div>
    <canvas id="webgl" aria-hidden="true"></canvas>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
